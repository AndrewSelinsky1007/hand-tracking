name: Build Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame opencv-python mediapipe pyinstaller

    # --- WINDOWS BUILD ---
    - name: Build Executables (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-all mediapipe demo.py
        pyinstaller --noconfirm --onedir --windowed --collect-all mediapipe --add-data "flappybirdbg.png;." --add-data "flappybird.png;." --add-data "toppipe.png;." --add-data "bottompipe.png;." flappybird.py

    # --- MACOS & LINUX BUILD ---
    - name: Build Executables (macOS / Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-all mediapipe demo.py
        pyinstaller --noconfirm --onedir --windowed --collect-all mediapipe --add-data "flappybirdbg.png:." --add-data "flappybird.png:." --add-data "toppipe.png:." --add-data "bottompipe.png:." flappybird.py

    # --- PACKAGE FOR DISTRIBUTION ---
    - name: Archive Builds
      run: |
        python -c "import shutil; shutil.make_archive('${{ matrix.os }}-FlappyBird', 'zip', 'dist/flappybird')"
        python -c "import shutil; shutil.make_archive('${{ matrix.os }}-HandDemo', 'zip', 'dist/demo')"

    - name: Upload Artifact - Flappy Bird
      uses: actions/upload-artifact@v4
      with:
        name: FlappyBird-${{ matrix.os }}
        path: ${{ matrix.os }}-FlappyBird.zip

    - name: Upload Artifact - Hand Demo
      uses: actions/upload-artifact@v4
      with:
        name: HandDemo-${{ matrix.os }}
        path: ${{ matrix.os }}-HandDemo.zip