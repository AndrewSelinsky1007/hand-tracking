name: Build Executables

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame opencv-python mediapipe==0.10.14 pyinstaller

    # --- WINDOWS BUILD ---
    - name: Build Executables (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --collect-all mediapipe --hidden-import mediapipe.solutions --hidden-import mediapipe.solutions.hands demo.py
        pyinstaller --noconfirm --onedir --collect-all mediapipe --hidden-import mediapipe.solutions --hidden-import mediapipe.solutions.hands --add-data "flappybirdbg.png;." --add-data "flappybird.png;." --add-data "toppipe.png;." --add-data "bottompipe.png;." flappybird.py
        pyinstaller --noconfirm --onedir --collect-all mediapipe --hidden-import mediapipe.solutions --hidden-import mediapipe.solutions.hands tetris.py

    # --- MACOS & LINUX BUILD ---
    - name: Build Executables (macOS / Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --collect-all mediapipe --hidden-import mediapipe.solutions --hidden-import mediapipe.solutions.hands demo.py
        pyinstaller --noconfirm --onedir --collect-all mediapipe --hidden-import mediapipe.solutions --hidden-import mediapipe.solutions.hands --add-data "flappybirdbg.png:." --add-data "flappybird.png:." --add-data "toppipe.png:." --add-data "bottompipe.png:." flappybird.py
        pyinstaller --noconfirm --onedir --collect-all mediapipe --hidden-import mediapipe.solutions --hidden-import mediapipe.solutions.hands tetris.py

    # --- TEST MACOS EXECUTION ---
    - name: Test macOS Executable Startup
      if: runner.os == 'macOS'
      run: |
        # Run the executable in the background, wait 5 seconds, then kill it cleanly
        ./dist/demo/demo &
        PID=$!
        sleep 5
        kill $PID || true

    # --- PACKAGE FOR DISTRIBUTION ---
    - name: Archive Builds
      run: |
        python -c "import shutil; shutil.make_archive('${{ matrix.os }}-FlappyBird', 'zip', 'dist/flappybird')"
        python -c "import shutil; shutil.make_archive('${{ matrix.os }}-HandDemo', 'zip', 'dist/demo')"
        python -c "import shutil; shutil.make_archive('${{ matrix.os }}-Tetris', 'zip', 'dist/tetris')"

    - name: Upload Artifact - Flappy Bird
      uses: actions/upload-artifact@v4
      with:
        name: FlappyBird-${{ matrix.os }}
        path: ${{ matrix.os }}-FlappyBird.zip

    - name: Upload Artifact - Hand Demo
      uses: actions/upload-artifact@v4
      with:
        name: HandDemo-${{ matrix.os }}
        path: ${{ matrix.os }}-HandDemo.zip

    - name: Upload Artifact - Tetris
      uses: actions/upload-artifact@v4
      with:
        name: Tetris-${{ matrix.os }}
        path: ${{ matrix.os }}-Tetris.zip